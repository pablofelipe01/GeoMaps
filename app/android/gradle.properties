# El template de Flutter pide -Xmx8G y 4G de metaspace: 12 GB solo para Gradle.
# En una maquina de 16 GB con el IDE y el navegador abiertos, eso no entra y el
# sistema mata el build a la mitad, con un error que no menciona la memoria.
# 2G de heap alcanzan de sobra para este proyecto.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m

# Compila en paralelo solo si hay con que. Con poca RAM libre, el paralelismo
# multiplica los procesos de Kotlin y es contraproducente.
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
