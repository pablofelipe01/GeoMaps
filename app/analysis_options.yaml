include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Codigo de drift. No se corrige a mano y sus lints no se pueden arreglar.
    - "**/*.g.dart"
  errors:
    # Un TODO no puede frenar un build de CI.
    todo: ignore

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
